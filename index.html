<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>RP Logboek</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#080A0D; --panel:#12151B; --panel2:#1A1F27; --line:#252B34;
    --text:#F2F5F8; --muted:#7E8794;
    --accent:#E8B04B; --good:#4FBF9A; --under:#4C6484; --hot:#E0605B;
    --display:"Space Grotesk",sans-serif; --body:"Inter",sans-serif; --mono:"JetBrains Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
  .wrap{max-width:560px;margin:0 auto;padding:0 18px calc(96px + env(safe-area-inset-bottom))}
  h1,h2,h3{font-family:var(--display);margin:0}
  .mono{font-family:var(--mono)}
  button{font-family:var(--body);cursor:pointer;border:none;color:inherit;background:none}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  input,select,textarea{font-family:var(--mono);background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px;width:100%}
  input:disabled{opacity:.4}

  header.status{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg),var(--bg) 82%,transparent);padding:22px 0 12px}
  .brand{font-family:var(--mono);font-size:11px;letter-spacing:.34em;color:var(--muted);text-transform:uppercase}
  .weekline{display:flex;align-items:baseline;gap:10px;margin-top:8px}
  .weekline .wk{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;letter-spacing:-.01em}
  .weekline .wk small{color:var(--muted);font-weight:500;font-size:18px}
  .phase{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .phase.deload{color:var(--accent)}
  .rirbadge{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:13px;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:6px 12px;white-space:nowrap}
  .progressbar{height:4px;background:var(--line);border-radius:2px;margin-top:16px;overflow:hidden}
  .progressbar>i{display:block;height:100%;background:var(--accent);transition:width .4s ease}

  /* onderste navigatiebalk (Technogym-stijl) */
  .bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
    background:rgba(10,12,16,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
    padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
  .bottomnav-inner{display:flex;width:100%;max-width:560px}
  .navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;color:var(--muted);font-size:11px;font-weight:600}
  .navbtn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .navbtn.on{color:var(--accent)}
  .tabs{display:none}
  .wrap.has-timer{padding-bottom:calc(192px + env(safe-area-inset-bottom))}
  .resttimer{position:fixed;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom));z-index:19;
    max-width:560px;margin:0 auto;padding:0 18px}
  .rt-controls{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .rt-adj{background:rgba(18,21,27,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid var(--line);border-radius:11px;color:var(--muted);font-family:var(--mono);font-weight:700;font-size:12px;padding:8px 12px}
  .rt-adj:active{transform:translateY(1px)}
  .rt-count{margin-left:auto;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--accent);
    background:rgba(18,21,27,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid var(--line);border-radius:11px;padding:8px 12px;white-space:nowrap}
  .rt-reset{font-weight:600;font-size:12px;color:var(--muted);
    background:rgba(18,21,27,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid var(--line);border-radius:11px;padding:8px 12px;white-space:nowrap}
  .rt-reset:active{transform:translateY(1px)}
  .rt-main{position:relative;overflow:hidden;width:100%;background:rgba(18,21,27,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid var(--accent);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .rt-main:active{transform:translateY(1px)}
  .rt-time{font-family:var(--mono);font-weight:700;font-size:25px;line-height:1;letter-spacing:.03em}
  .rt-label{font-size:10.5px;color:var(--muted);margin-top:3px}
  .rt-bar{position:absolute;left:0;bottom:0;height:3px;width:100%}
  .rt-bar>i{display:block;height:100%;background:var(--accent);transition:width .25s linear}
  .resttimer.done .rt-main{border-color:var(--good);background:rgba(79,191,154,.16);animation:pulse 1.1s ease-in-out 3}
  .resttimer.done .rt-time{color:var(--good)}
  .tabs button.on{background:var(--panel2);color:var(--text)}

  .dayhead{display:flex;align-items:center;gap:10px;margin:18px 2px 2px}
  .dayhead .tag{font-family:var(--mono);font-weight:700;font-size:13px;background:var(--accent);color:#141414;border-radius:7px;padding:3px 9px}
  .dayhead h2{font-size:16px;font-weight:600;flex:1}
  .dayhead .cnt{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .daysub{color:var(--muted);font-size:13px;margin:2px 2px 10px}

  /* session bar */
  .sessbar{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:6px 0 14px}
  .sessbar.live{border-color:var(--accent)}
  .sessbar .live-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,176,75,.5)}70%{box-shadow:0 0 0 8px rgba(232,176,75,0)}100%{box-shadow:0 0 0 0 rgba(232,176,75,0)}}
  .sessbar .t{font-family:var(--mono);font-size:19px;font-weight:700;letter-spacing:.03em}
  .sessbar .sub{font-size:12px;color:var(--muted)}
  .sessbar .sp{flex:1}
  .chip{border-radius:9px;padding:10px 14px;font-weight:600;font-size:14px;white-space:nowrap}
  .chip-in{background:var(--accent);color:#141414}
  .chip-in.wide{display:block;width:100%;text-align:center}
  .checkin{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin:6px 0 14px}
  .checkin-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
  .daypick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .daypick-btn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center;color:var(--muted)}
  .daypick-btn .d{font-family:var(--display);font-weight:700;font-size:19px;display:block;line-height:1}
  .daypick-btn .n{font-size:11px;margin-top:4px;display:block}
  .daypick-btn.on{border-color:var(--accent);color:var(--text);background:rgba(232,176,75,.09)}
  .daypick-btn.on .d{color:var(--accent)}
  .chip-out{background:var(--panel2);border:1px solid var(--line);color:var(--text)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;transition:opacity .2s}
  .card.checked{opacity:.5}
  .card .top{display:flex;align-items:center;gap:8px}
  .card .idx{font-family:var(--mono);color:var(--muted);font-size:13px}
  .card .name{font-family:var(--display);font-weight:600;font-size:17px;flex:1}
  .card .anchor{color:var(--accent)}
  .card .mg{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px;white-space:nowrap}
  .tick{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);color:transparent;font-size:15px;display:flex;align-items:center;justify-content:center;flex:none}
  .tick.on{background:var(--good);border-color:var(--good);color:#0F131B;font-weight:700}
  .meta{font-family:var(--mono);font-size:13px;margin:9px 0 2px;display:flex;gap:6px;flex-wrap:wrap}
  .meta .dot{color:var(--line)}
  .prev{font-size:12.5px;color:var(--muted);margin:6px 0 2px}
  .prev b{color:var(--text);font-family:var(--mono);font-weight:500}
  .cue{font-size:12.5px;color:var(--good);margin:4px 0 10px}
  .howto{display:inline-block;margin:2px 0 4px;font-size:12px;font-weight:600;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
  .howto-body{font-size:13px;color:var(--text);line-height:1.55;background:var(--panel2);border-radius:12px;padding:12px 14px;margin:6px 0 10px}
  .cue.deloadcue{color:var(--accent)}
  .hint{font-size:12.5px;color:var(--muted);margin:8px 0 2px;font-style:italic}

  .colhead{display:grid;grid-template-columns:26px 1fr 1fr 1fr auto;gap:7px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;padding:0 2px}
  .colhead span:first-child{text-align:center}
  .setrow{display:grid;grid-template-columns:26px 1fr 1fr 1fr auto;gap:7px;align-items:center;margin-bottom:7px}
  .setrow .sn{font-family:var(--mono);color:var(--muted);font-size:13px;text-align:center}
  .setrow input{padding:8px}
  .savebtn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-weight:600;font-size:13px}
  .savebtn:active{transform:translateY(1px)}
  .logged{display:grid;grid-template-columns:26px 1fr auto;gap:7px;align-items:center;background:var(--panel2);border-radius:9px;padding:8px 10px;margin-bottom:7px}
  .logged .val{font-family:var(--mono);font-size:14px}
  .logged .val .rir{color:var(--muted)}
  .logged .del{color:var(--muted);font-size:16px;padding:2px 6px;line-height:1}
  .logged .del:hover{color:var(--hot)}

  .actions{display:flex;flex-direction:column;gap:9px;margin-top:6px}
  .btn{border-radius:11px;padding:13px;font-weight:600;font-size:15px;text-align:center}
  .btn-primary{background:var(--accent);color:#141414}
  .btn-ghost{background:var(--panel);border:1px solid var(--line);color:var(--text)}
  .btn-back{background:transparent;border:1px solid var(--line);color:var(--muted);font-size:13px;padding:10px}
  .btn:active{transform:translateY(1px)}

  .goalcard{background:var(--panel);border:1px solid var(--accent);border-radius:14px;padding:16px;margin-top:14px}
  .gc-head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
  .gc-wk{font-family:var(--mono);font-weight:700;font-size:12px;color:#141414;background:var(--accent);border-radius:6px;padding:3px 8px}
  .gc-title{font-family:var(--display);font-weight:600;font-size:16px}
  .gc-body{font-size:13.5px;color:var(--text);line-height:1.55;margin:0}
  .section-h{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:24px 2px 4px}  .section-sub{color:var(--muted);font-size:12.5px;margin:0 2px 14px}
  .meter{margin-bottom:16px}
  .meter .lbl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
  .meter .lbl .m{font-family:var(--display);font-weight:600;font-size:14px}
  .meter .lbl .c{font-family:var(--mono);font-size:13px;color:var(--muted)}
  .meter .lbl .c b{color:var(--text)} .c.on-good b{color:var(--good)} .c.on-hot b{color:var(--hot)} .c.on-under b{color:var(--under)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:2px 2px 16px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .chartwrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:6px}
  .chartwrap select{margin-bottom:12px}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:22px 0}

  /* gewicht */
  .bwhead{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:6px}
  .bwhead .big{font-family:var(--display);font-weight:700;font-size:40px;line-height:1}
  .bwhead .big small{font-size:18px;color:var(--muted);font-weight:500}
  .bwhead .delta{font-family:var(--mono);font-size:14px;margin-top:4px}
  .bwhead .delta.up{color:var(--good)}
  .goalbar{height:9px;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:16px 0 6px}
  .goalbar>i{display:block;height:100%;background:var(--good)}
  .goalrow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .rate{font-size:12.5px;color:var(--muted);margin-top:12px}
  .rate b{color:var(--text)}
  .logbw{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}
  .bwrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:8px}
  .bw-date{font-size:13px;color:var(--muted)}
  .bw-val{font-family:var(--mono);font-weight:700;font-size:15px}

  /* schema/import */
  .imp textarea{min-height:180px;font-size:12.5px;line-height:1.5;resize:vertical}
  .imp .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .imp .row .btn{flex:1;min-width:130px}
  .imp pre{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted);line-height:1.5}
  .imp .msg{font-size:13px;margin-top:10px;font-family:var(--mono)}
  .imp .msg.ok{color:var(--good)} .imp .msg.bad{color:var(--hot)}

  .setup{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:40px}
  .setup h2{font-size:18px;margin-bottom:8px}
  .setup p{color:var(--muted);font-size:14px;line-height:1.55}
  .setup code{font-family:var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12.5px;color:var(--accent)}
  .center{min-height:60vh;display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .err{color:var(--hot);font-size:13px;margin-top:10px}
  /* uitleg */
  .infobtn{width:100%;margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px;font-weight:600;font-size:13px;color:var(--accent);text-align:left}
  .glossary{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 14px;margin-top:8px}
  .gterm{padding:10px 0;border-bottom:1px solid var(--line)}
  .gterm:last-child{border-bottom:none}
  .gt{display:inline-block;font-family:var(--mono);font-weight:700;font-size:13px;color:var(--accent);margin-right:8px}
  .gd{font-size:13px;color:var(--text);line-height:1.5}
  /* geschiedenis */
  .hist{margin-top:26px}
  .histitem{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .hi-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .hi-tag{font-family:var(--mono);font-weight:700;font-size:12px;background:var(--panel2);color:var(--text);border-radius:6px;padding:2px 8px}
  .hi-meta{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
  .hi-date{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .hi-actions{display:flex;gap:7px;margin-top:11px}
  .hi-btn{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px;font-weight:600;font-size:12.5px;color:var(--text)}
  .hi-btn:active{transform:translateY(1px)}
  .hi-btn.danger{color:var(--hot);border-color:rgba(224,96,91,.4)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const {useState, useEffect} = React;

/* ==== 1. VUL HIER JE SUPABASE-GEGEVENS IN ==== */
const SUPABASE_URL      = "https://ywpasasutrveoykxtiup.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_npaSadAbv9DWmBHtpJAe5A_RQLsCAOS";

/* ==== 2. Je bulk-doelen (pas gerust aan) ==== */
const START_WEIGHT = 100;   // startgewicht bulk
const GOAL_WEIGHT  = 105;   // doelgewicht
/* ============================================= */

const RIR_BY_WEEK = {1:"3", 2:"2–3", 3:"2", 4:"1", 5:"0–1", 6:"4–5"};
const WEEK_GOALS = {
  1:{t:"Instapweek — nulmeting", d:"Rustig starten rond MEV (de onderkant van je volume). Houd nog 3 herhalingen over (RIR 3) en leg de nadruk op techniek. Kies gewichten die makkelijk voelen; dit is je startpunt om vanaf te groeien."},
  2:{t:"Opbouwen", d:"Zelfde volume, maar probeer bij elke oefening iets meer reps of gewicht dan vorige week (RIR 2–3). Kleine stapjes, elke week net iets beter."},
  3:{t:"Volume omhoog", d:"Bij je anker-oefeningen (★) komt er een set bij, richting MAV — de zone waar je het meest groeit. Het mag zwaarder voelen (RIR 2)."},
  4:{t:"Doorbouwen", d:"Dicht bij falen nu (RIR 1). Blijf reps of gewicht toevoegen. Je zit in de productieve MAV-zone; vermoeidheid stapelt op — let op je herstel."},
  5:{t:"Piekweek — zwaarste week", d:"Bijna tot falen (RIR 0–1) en nog een extra set bij je ankers, tegen MRV aan (het maximum dat je nog kunt herstellen). Alles geven, want daarna komt rust."},
  6:{t:"Deload — herstelweek", d:"Halve sets, ongeveer 2/3 van het gewicht, ver van falen (RIR 4–5). Doel is fris worden, níet presteren. Hierna start je een nieuw blok."},
};
const DAY_NAMES = {A:"Borst · Triceps · Schouders", B:"Rug · Biceps", C:"Benen"};
const DAY_SHORT = {A:"Borst e.a.", B:"Rug e.a.", C:"Benen"};
const EXERCISE_INFO = {
  "Bench press":"Lig plat, schouderbladen samengeknepen en omlaag. Laat de stang gecontroleerd naar je middenborst zakken, ellebogen ~45°. Duw omhoog zonder je billen van de bank te tillen.",
  "Incline dumbbell press":"Bankhoek ~30°. Dumbbells op borsthoogte, pols recht boven de elleboog. Duw omhoog en licht naar elkaar toe; laat gecontroleerd zakken tot je rek voelt.",
  "Overhead press":"Sta rechtop, buik en billen aangespannen. Duw de stang van je bovenborst recht omhoog tot je armen gestrekt zijn; hoofd licht naar voren als de stang passeert.",
  "Lateral raise":"Kleine buiging in de ellebogen. Til de dumbbells zijwaarts tot schouderhoogte, leid met je ellebogen (niet je handen), en laat langzaam zakken.",
  "Triceps pushdown":"Ellebogen tegen je zij, alleen je onderarm beweegt. Duw omlaag tot je armen gestrekt zijn, knijp je triceps aan, kom gecontroleerd terug.",
  "Overhead triceps ext":"Ellebogen omhoog en dicht bij je hoofd. Laat het gewicht achter je hoofd zakken, strek dan volledig; alleen je onderarm beweegt.",
  "Lat pulldown":"Grip iets breder dan schouderbreedte. Trek de stang naar je bovenborst, ellebogen omlaag en naar achteren, borst omhoog. Laat gecontroleerd terug tot volledige rek.",
  "Barbell row":"Kantel vanuit je heupen ~45°, rug recht. Trek de stang naar je onderste ribben, ellebogen langs je lichaam; laat gecontroleerd zakken.",
  "Seated cable row":"Rechte rug, lichte kanteling. Trek de greep naar je navel en knijp je schouderbladen samen; laat je armen weer volledig strekken.",
  "Face pull":"Touw op gezichtshoogte. Trek naar je gezicht met je ellebogen hoog en je handen uit elkaar; knijp je achterste schouders aan.",
  "EZ-bar curl":"Ellebogen tegen je zij, romp stil. Krul omhoog zonder te zwaaien, knijp bovenaan, laat langzaam en volledig zakken.",
  "Incline dumbbell curl":"Achterover op een schuine bank, armen hangend. Krul omhoog zonder je bovenarm mee te bewegen — dit geeft extra rek op de biceps.",
  "Squat":"Voeten schouderbreed, tenen licht naar buiten. Zak alsof je gaat zitten, knieën in lijn met je tenen, borst omhoog, rug neutraal. Tot minstens dijen parallel, dan omhoog.",
  "Romanian deadlift":"Lichte kniebuiging, duw je heupen naar achteren, stang dicht langs je benen. Zak tot je rek in je hamstrings voelt (rug recht) en kom omhoog door je heupen naar voren te duwen.",
  "Leg press":"Voeten op schouderbreedte op het plateau. Zak tot je knieën ~90° zijn, onderrug tegen de steun; duw via je hielen omhoog zonder je knieën volledig te blokkeren.",
  "Leg curl":"Enkels achter de rol, heupen tegen de bank. Buig je knieën en trek je hielen naar je billen; laat gecontroleerd terug, niet laten klappen.",
  "Leg extension":"Rug tegen de steun, rol op je onderbenen. Strek je knieën volledig en knijp je quads bovenaan; laat langzaam zakken.",
  "Calf raise":"Kom zo hoog mogelijk op je tenen met een korte knijp bovenaan; zak diep tot je rek in je kuiten voelt. Rustig tempo, geen zwaai.",
};
const nextDay = d => (d==="A"?"B":d==="B"?"C":"A");
const fmt = n => (Math.round(Number(n)*100)/100).toString();
const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };

const configured = !SUPABASE_URL.includes("JOUW-PROJECT") && !SUPABASE_ANON_KEY.includes("JOUW-ANON");
const db = configured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

function setsForWeek(ex, week){
  if(week>=6) return Math.max(1, Math.ceil(ex.base_sets/2));
  let s = ex.base_sets;
  if(ex.is_anchor && week>=3) s++;
  if(ex.is_anchor && week>=5) s++;
  return s;
}

function prevAndCue(ex, week, logs, activeSessionId){
  const past = logs
    .filter(x => x.exercise_id===ex.id && !(activeSessionId && x.session_id===activeSessionId))
    .sort((a,b)=> new Date(b.logged_at)-new Date(a.logged_at));
  if(past.length===0) return {prev:[], cue:"Eerste keer — kies een gewicht waarbij je net de onderkant van de rep-range haalt.", sug:null};
  const gkey = x => x.session_id!=null ? "s"+x.session_id : x.week+"-"+x.day;
  const k = gkey(past[0]);
  const prev = past.filter(x=>gkey(x)===k).sort((a,b)=>a.set_number-b.set_number);
  const top = Math.max(...prev.map(s=>Number(s.weight)));
  const repsAtTop = Math.min(...prev.filter(s=>Number(s.weight)===top).map(s=>s.reps));
  let sug, cue, deload=false;
  if(week>=6){ sug=Math.round((top*0.65)/2.5)*2.5; cue="Deload — lichter, en stop elke set op 4–5 RIR."; deload=true; }
  else if(repsAtTop>=ex.rep_max){ sug=top+Number(ex.weight_increment); cue=`Top van de range gehaald → +${fmt(ex.weight_increment)} kg, mik op ${ex.rep_min}+ reps.`; }
  else { sug=top; cue=`Zelfde gewicht, mik op ${repsAtTop+1}+ reps (richting ${ex.rep_max}).`; }
  return {prev, cue, deload, sug};
}

/* ==================== App ==================== */
function App(){
  const [st,setSt] = useState({loading:true,error:null});
  const [muscles,setMuscles]=useState([]);
  const [exercises,setExercises]=useState([]);
  const [meso,setMeso]=useState(null);
  const [logs,setLogs]=useState([]);
  const [sessions,setSessions]=useState([]);
  const [session,setSession]=useState(null);
  const [checks,setChecks]=useState([]);
  const [bw,setBw]=useState([]);
  const [tab,setTab]=useState("vandaag");
  const [showGlossary,setShowGlossary]=useState(false);
  const [selDay,setSelDay]=useState(null);

  async function loadAll(){
    try{
      const [mg,ex] = await Promise.all([
        db.from("muscle_groups").select("*").order("id"),
        db.from("exercises").select("*").eq("active",true).order("order_index"),
      ]);
      if(mg.error) throw mg.error; if(ex.error) throw ex.error;
      const ms = await db.from("mesocycles").select("*").eq("active",true).order("id",{ascending:false}).limit(1);
      if(ms.error) throw ms.error;
      const m = (ms.data && ms.data[0]) || null;
      let lg=[], allSess=[], sess=null, chk=[];
      if(m){
        const l = await db.from("set_logs").select("*").eq("mesocycle_id",m.id).order("logged_at");
        if(l.error) throw l.error; lg=l.data||[];
        const s = await db.from("sessions").select("*").eq("mesocycle_id",m.id).order("id",{ascending:false});
        if(s.error) throw s.error; allSess=s.data||[]; sess=allSess.find(x=>!x.ended_at)||null;
        if(sess){ const c=await db.from("session_checks").select("*").eq("session_id",sess.id); chk=c.data||[]; }
      }
      const b = await db.from("bodyweight_logs").select("*").order("date");
      if(b.error) throw b.error;
      setMuscles(mg.data||[]); setExercises(ex.data||[]); setMeso(m); setLogs(lg);
      setSessions(allSess); setSession(sess); setChecks(chk); setBw(b.data||[]);
      setSt({loading:false,error:null});
    }catch(e){ setSt({loading:false,error:e.message||String(e)}); }
  }
  useEffect(()=>{ if(configured) loadAll(); },[]);

  async function startMeso(){
    await db.from("mesocycles").update({active:false}).eq("active",true);
    await db.from("mesocycles").insert({name:"Blok "+new Date().toLocaleDateString("nl-NL"),current_week:1,current_day:"A",active:true});
    await loadAll();
  }
  async function checkIn(day){
    await db.from("sessions").insert({mesocycle_id:meso.id,week:meso.current_week,day:day||meso.current_day});
    setSelDay(null);
    await loadAll();
  }
  async function checkOut(){
    if(session){
      await db.from("sessions").update({ended_at:new Date().toISOString()}).eq("id",session.id);
      if(session.day===meso.current_day) await db.from("mesocycles").update({current_day:nextDay(meso.current_day)}).eq("id",meso.id);
    }
    await loadAll();
  }
  async function toggleCheck(exId){
    const ex = checks.find(c=>c.exercise_id===exId);
    if(ex) await db.from("session_checks").delete().eq("id",ex.id);
    else await db.from("session_checks").insert({session_id:session.id,exercise_id:exId});
    await loadAll();
  }
  async function logSet(ex,setNumber,weight,reps,rir){
    const wk=session?session.week:meso.current_week, dy=session?session.day:meso.current_day;
    const r=await db.from("set_logs").insert({mesocycle_id:meso.id,session_id:session?session.id:null,week:wk,day:dy,exercise_id:ex.id,set_number:setNumber,weight,reps,rir});
    if(r.error){ alert("Opslaan mislukt: "+r.error.message); return; }
    await loadAll();
  }
  async function delLog(id){ await db.from("set_logs").delete().eq("id",id); await loadAll(); }
  async function reopenSession(s){
    if(session && session.id!==s.id) await db.from("sessions").update({ended_at:new Date().toISOString()}).eq("id",session.id);
    await db.from("sessions").update({ended_at:null}).eq("id",s.id);
    setTab("vandaag"); await loadAll();
  }
  async function clearSession(s){
    if(!window.confirm("Alle sets van deze training wissen? De training zelf blijft bestaan.")) return;
    await db.from("session_checks").delete().eq("session_id",s.id);
    await db.from("set_logs").delete().eq("session_id",s.id);
    await loadAll();
  }
  async function deleteSession(s){
    if(!window.confirm("Deze hele training verwijderen? Dit kan niet ongedaan worden gemaakt.")) return;
    await db.from("session_checks").delete().eq("session_id",s.id);
    await db.from("set_logs").delete().eq("session_id",s.id);
    await db.from("sessions").delete().eq("id",s.id);
    await loadAll();
  }
  async function advanceWeek(){ if(meso.current_week<6){ await db.from("mesocycles").update({current_week:meso.current_week+1}).eq("id",meso.id); await loadAll(); } }
  async function goBackWeek(){ if(meso.current_week>1){ await db.from("mesocycles").update({current_week:meso.current_week-1}).eq("id",meso.id); await loadAll(); } }
  async function logBodyweight(weight){
    const d=todayStr();
    const ex=bw.find(x=>x.date===d);
    const r = ex ? await db.from("bodyweight_logs").update({weight}).eq("id",ex.id)
                 : await db.from("bodyweight_logs").insert({date:d,weight});
    if(r.error){ alert("Gewicht opslaan mislukt: "+r.error.message); return; }
    await loadAll();
  }
  async function delBodyweight(id){ await db.from("bodyweight_logs").delete().eq("id",id); await loadAll(); }

  if(!configured) return <Setup/>;
  if(st.loading) return <div className="center">Laden…</div>;
  if(st.error) return <div className="wrap"><div className="setup"><h2>Verbindingsfout</h2><p>Controleer je Supabase-URL, de anon-key en of je het schema hebt gedraaid.</p><div className="err mono">{st.error}</div></div></div>;

  if(!meso) return (
    <div className="wrap">
      <header className="status"><div className="brand">RP · Logboek</div></header>
      <div className="setup"><h2>Nog geen mesocyclus</h2><p>Start je eerste blok van 6 weken (week 1, dag A).</p>
        <div style={{marginTop:16}}><button className="btn btn-primary" style={{width:"100%"}} onClick={startMeso}>Start mesocyclus</button></div></div>
    </div>
  );

  const activeDay = session ? session.day : (selDay || meso.current_day);
  const activeWeek = session ? session.week : meso.current_week;
  const phase = meso.current_week>=6 ? "Deload" : "Accumulatie";
  const todayEx = exercises.filter(e=>e.day===activeDay);
  const checkedIds = new Set(checks.map(c=>c.exercise_id));
  const endedSessions = sessions.filter(s=>s.ended_at).sort((a,b)=> new Date(b.started_at)-new Date(a.started_at));

  return (
    <div className={"wrap"+(session?" has-timer":"")}>
      <header className="status">
        <div className="brand">RP · Logboek</div>
        <div className="weekline">
          <div className="wk">Week {meso.current_week}<small> / 6</small></div>
          <div className={"phase"+(phase==="Deload"?" deload":"")}>{phase}</div>
          <div className="rirbadge">RIR {RIR_BY_WEEK[meso.current_week]}</div>
        </div>
        <div className="progressbar"><i style={{width:(meso.current_week/6*100)+"%"}}/></div>
      </header>

      <button className="infobtn" onClick={()=>setShowGlossary(g=>!g)}>
        {showGlossary ? "▲ Uitleg verbergen" : "ℹ Uitleg — wat betekenen de afkortingen?"}
      </button>
      {showGlossary && <Glossary/>}

      {tab==="vandaag" && (
        <>
          <div className="dayhead">
            <span className="tag">DAG {activeDay}</span>
            <h2>{DAY_NAMES[activeDay]}</h2>
            <span className="cnt">{checkedIds.size}/{todayEx.length} ✓</span>
          </div>
          <p className="daysub">Rotatie schuift door na uitchecken.</p>

          {session ? (
            <div className="sessbar live">
              <span className="live-dot"/>
              <div><div className="t"><Timer start={session.started_at}/></div><div className="sub">Bezig — Week {session.week} · Dag {session.day}</div></div>
              <span className="sp"/>
              <button className="chip chip-out" onClick={checkOut}>Check uit ✓</button>
            </div>
          ) : (
            <div className="checkin">
              <div className="checkin-label">Kies je training</div>
              <div className="daypick">
                {["A","B","C"].map(d=>(
                  <button key={d} className={"daypick-btn"+(activeDay===d?" on":"")} onClick={()=>setSelDay(d)}>
                    <span className="d">{d}</span>
                    <span className="n">{DAY_SHORT[d]}</span>
                  </button>
                ))}
              </div>
              <button className="chip chip-in wide" onClick={()=>checkIn(activeDay)}>▶ Check in — Dag {activeDay}</button>
            </div>
          )}

          {todayEx.map(ex=>(
            <ExerciseCard key={ex.id} ex={ex} week={activeWeek} session={session} logs={logs}
              checked={checkedIds.has(ex.id)} muscle={muscles.find(m=>m.id===ex.muscle_group_id)}
              onLog={logSet} onDel={delLog} onToggle={toggleCheck}/>
          ))}

          <div className="actions">
            {meso.current_week<6
              ? <button className="btn btn-ghost" onClick={advanceWeek}>Week afronden → Week {meso.current_week+1}</button>
              : <button className="btn btn-ghost" onClick={startMeso}>Deload klaar → Nieuwe mesocyclus</button>}
            {meso.current_week>1 &&
              <button className="btn btn-back" onClick={goBackWeek}>← Terug naar week {meso.current_week-1}</button>}
          </div>

          <History sessions={endedSessions} logs={logs} onReopen={reopenSession} onClear={clearSession} onDelete={deleteSession}/>

      {tab==="voortgang" && <Progress muscles={muscles} exercises={exercises} logs={logs} meso={meso}/>}
      {tab==="gewicht" && <Gewicht bw={bw} onLog={logBodyweight} onDel={delBodyweight}/>}

      {session && <RestTimer/>}

      <nav className="bottomnav">

            <span>Training</span>
          </button>
          <button className={"navbtn"+(tab==="voortgang"?" on":"")} onClick={()=>setTab("voortgang")}>

            <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
            <span>Schema</span>
          </button>
        </div>
      </nav>
    </div>
  );
}

function Timer({start}){
  const [now,setNow]=useState(Date.now());
  useEffect(()=>{ const id=setInterval(()=>setNow(Date.now()),1000); return ()=>clearInterval(id); },[]);
  const s=Math.max(0,Math.floor((now-new Date(start).getTime())/1000));
  const p=n=>String(n).padStart(2,"0");
  return <span>{p(Math.floor(s/3600))}:{p(Math.floor(s%3600/60))}:{p(s%60)}</span>;
}

/* ---------- Rusttimer ---------- */
function RestTimer(){
  const [dur,setDur]=useState(120);
  const [endAt,setEndAt]=useState(null);
  const [now,setNow]=useState(Date.now());
  const [done,setDone]=useState(false);
  const [sets,setSets]=useState(0);
  const audioRef=React.useRef(null);
  const firedRef=React.useRef(false);

  useEffect(()=>{
    if(endAt==null) return;
    const id=setInterval(()=>setNow(Date.now()),200);
    return ()=>clearInterval(id);
  },[endAt]);

  const remaining = endAt!=null ? Math.max(0, Math.round((endAt-now)/1000)) : dur;
  const running = endAt!=null && remaining>0;

  useEffect(()=>{
    if(endAt!=null && remaining===0 && !firedRef.current){
      firedRef.current=true; setDone(true);
      try{
        const ctx=audioRef.current;
        if(ctx){
          const beep=(t,f)=>{ const o=ctx.createOscillator(),g=ctx.createGain(); o.connect(g); g.connect(ctx.destination);
            o.frequency.value=f; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.35,t+0.02);
            g.gain.exponentialRampToValueAtTime(0.0001,t+0.35); o.start(t); o.stop(t+0.4); };
          beep(ctx.currentTime,880); beep(ctx.currentTime+0.45,1175);
        }
      }catch(e){}
      if(navigator.vibrate){ try{ navigator.vibrate([250,120,250]); }catch(e){} }
    }
  },[remaining,endAt]);

  const tap=()=>{
    try{
      if(!audioRef.current){ const AC=window.AudioContext||window.webkitAudioContext; if(AC) audioRef.current=new AC(); }
      if(audioRef.current && audioRef.current.state==="suspended") audioRef.current.resume();
    }catch(e){}
    firedRef.current=false; setDone(false);
    setSets(s=>s+1);
    setNow(Date.now()); setEndAt(Date.now()+dur*1000);
  };
  const reset=()=>{ setSets(0); setEndAt(null); setDone(false); firedRef.current=false; };
  const adjust=(delta)=>{
    const d2=Math.max(30, Math.min(600, dur+delta));
    setDur(d2);
    if(running){ firedRef.current=false; setDone(false); setNow(Date.now()); setEndAt(Date.now()+d2*1000); }
  };

  const mm=Math.floor(remaining/60), ss=remaining%60;
  const timeStr=mm+":"+String(ss).padStart(2,"0");
  const label = sets===0 ? "Tik na je 1e set" : done ? "Rust klaar — tik = volgende set" : running ? "Rusten — tik = volgende set" : "Tik na je set";
  const pct = endAt!=null ? Math.max(0,(remaining/dur)*100) : 100;

  return (
    <div className={"resttimer"+(done?" done":"")}>
      <div className="rt-controls">
        <button className="rt-adj" onClick={()=>adjust(-15)} aria-label="15 seconden minder">−15</button>
        <button className="rt-adj" onClick={()=>adjust(15)} aria-label="15 seconden meer">+15</button>
        <span className="rt-count">{sets} {sets===1?"set":"sets"} gedaan</span>
        <button className="rt-reset" onClick={reset} aria-label="Setteller resetten">↺ Reset</button>
      </div>
      <button className="rt-main" onClick={tap}>
        <span className="rt-time">{timeStr}</span>
        <span className="rt-label">{label}</span>
        <span className="rt-bar"><i style={{width:pct+"%"}}/></span>
      </button>
    </div>
  );
}

/* ---------- Oefeningkaart ---------- */
function ExerciseCard({ex,week,session,logs,checked,muscle,onLog,onDel,onToggle}){
  const active=!!session;
  const target=setsForWeek(ex,week);
  const rir=RIR_BY_WEEK[week];
  const {prev,cue,deload,sug}=prevAndCue(ex,week,logs,session?session.id:null);
  const todays=active ? logs.filter(x=>x.exercise_id===ex.id && x.session_id===session.id).sort((a,b)=>a.set_number-b.set_number) : [];
  const rirDefault=parseInt(rir,10);
  const [draft,setDraft]=useState({});
  const [showInfo,setShowInfo]=useState(false);
  const info=EXERCISE_INFO[ex.name];
  const upd=(n,f,v)=>setDraft(d=>({...d,[n]:{...(d[n]||{}),[f]:v}}));
  const save=(n)=>{
    const d=draft[n]||{};
    const w=parseFloat(d.weight!=null&&d.weight!==""?d.weight:(sug??""));
    const r=parseInt(d.reps,10);
    const ri=d.rir!=null&&d.rir!==""?parseInt(d.rir,10):rirDefault;
    if(isNaN(w)||isNaN(r)){ alert("Vul gewicht en reps in."); return; }
    onLog(ex,n,w,r,ri); setDraft(x=>({...x,[n]:{}}));
  };

  return (
    <div className={"card"+(checked?" checked":"")}>
      <div className="top">
        <span className="idx">{ex.order_index}</span>
        <span className="name">{ex.name}{ex.is_anchor && <span className="anchor" title="Volume-ramp"> ★</span>}</span>
        <span className="mg">{muscle?muscle.name:""}</span>
        <button className={"tick"+(checked?" on":"")} disabled={!active} onClick={()=>onToggle(ex.id)}
          aria-label={checked?"Vink uit":"Vink af"} title={active?"Afvinken":"Check eerst in"}>✓</button>
      </div>
      <div className="meta"><span>{target} sets</span><span className="dot">·</span><span>{ex.rep_min}–{ex.rep_max} reps</span><span className="dot">·</span><span>RIR {rir}</span></div>
      {info && <button className="howto" onClick={()=>setShowInfo(v=>!v)}>{showInfo?"▲ Uitvoering verbergen":"ⓘ Hoe voer ik dit uit?"}</button>}
      {info && showInfo && <div className="howto-body">{info}</div>}
      <div className="prev">{prev.length ? <>Vorige: <b>{prev.map(s=>fmt(s.weight)+"×"+s.reps).join(", ")}</b></> : "Vorige: —"}</div>
      <div className={"cue"+(deload?" deloadcue":"")}>{cue}</div>

      {!active ? <div className="hint">Check in om je sets te loggen.</div> : (
        <>
          <div className="colhead"><span>#</span><span>kg</span><span>reps</span><span>rir</span><span></span></div>
          {Array.from({length:target}).map((_,i)=>{
            const n=i+1; const done=todays.find(t=>t.set_number===n);
            if(done) return (
              <div className="logged" key={n}>
                <span className="sn mono">{n}</span>
                <span className="val">{fmt(done.weight)} kg × {done.reps} <span className="rir">@ {done.rir} RIR</span></span>
                <button className="del" onClick={()=>onDel(done.id)} aria-label="Verwijder set">✕</button>
              </div>
            );
            const d=draft[n]||{};
            return (
              <div className="setrow" key={n}>
                <span className="sn">{n}</span>
                <input inputMode="decimal" placeholder={sug!=null?fmt(sug):"kg"} value={d.weight??""} onChange={e=>upd(n,"weight",e.target.value)} aria-label="gewicht"/>
                <input inputMode="numeric" placeholder={String(ex.rep_min)} value={d.reps??""} onChange={e=>upd(n,"reps",e.target.value)} aria-label="reps"/>
                <input inputMode="numeric" placeholder={String(rirDefault)} value={d.rir??""} onChange={e=>upd(n,"rir",e.target.value)} aria-label="rir"/>
                <button className="savebtn" onClick={()=>save(n)}>Log</button>
              </div>
            );
          })}
        </>
      )}
    </div>
  );
}

/* ---------- Geschiedenis ---------- */
function History({sessions,logs,onReopen,onClear,onDelete}){
  if(!sessions.length) return null;
  const fmtDate=s=>{ const d=new Date(s); return d.toLocaleDateString("nl-NL",{day:"numeric",month:"short"})+" "+d.toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"}); };
  const dur=s=>{ if(!s.ended_at) return ""; const m=Math.round((new Date(s.ended_at)-new Date(s.started_at))/60000); return m>0?m+" min":""; };
  return (
    <div className="hist">
      <h3 className="section-h">Geschiedenis</h3>
      <p className="section-sub">Heropen een training om 'm aan te passen, maak 'm leeg om opnieuw te beginnen, of verwijder 'm.</p>
      {sessions.slice(0,12).map(s=>{
        const n=logs.filter(l=>l.session_id===s.id).length;
        return (
          <div className="histitem" key={s.id}>
            <div className="hi-top">
              <span className="hi-tag">DAG {s.day}</span>
              <span className="hi-meta">Week {s.week} · {n} sets{dur(s)?" · "+dur(s):""}</span>
              <span className="hi-date">{fmtDate(s.started_at)}</span>
            </div>
            <div className="hi-actions">
              <button className="hi-btn" onClick={()=>onReopen(s)}>Heropenen</button>
              <button className="hi-btn" onClick={()=>onClear(s)}>Leegmaken</button>
              <button className="hi-btn danger" onClick={()=>onDelete(s)}>Verwijderen</button>
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ---------- Uitleg / begrippen ---------- */
function Glossary(){
  const items=[
    ["RP","Renaissance Periodization — de trainingsmethode waar deze app op leunt."],
    ["Mesocyclus","Een trainingsblok van een paar weken (hier 6) dat naar een piek toewerkt, met daarna een rustweek."],
    ["Set","Een reeks herhalingen achter elkaar; daarna rust je even."],
    ["Reps","Herhalingen — hoe vaak je de oefening in één set uitvoert."],
    ["RIR","Reps In Reserve: hoeveel herhalingen je aan het eind van een set nog overhad. RIR 2 = je had er nog 2 gekund. Lager getal = zwaarder."],
    ["Volume","Het totale aantal sets voor een spiergroep per week."],
    ["MV","Maintenance Volume: net genoeg om spier te behouden."],
    ["MEV","Minimum Effective Volume: het minste dat nog groei geeft. Hier begin je elk blok."],
    ["MAV","Maximum Adaptive Volume: de zone waarin je het meeste groeit."],
    ["MRV","Maximum Recoverable Volume: het meeste dat je nog kunt herstellen — daarboven wordt het te veel."],
    ["Deload","Een lichte herstelweek (week 6): minder sets, lichter gewicht, verder van falen."],
    ["Dag A / B / C","Je drie trainingsdagen die je afwisselt. A = borst/triceps/schouders, B = rug/biceps, C = benen."],
    ["★ (anker)","Een hoofdoefening waar om de paar weken automatisch een set bij komt."],
    ["Lean bulk","Rustig aankomen (0,25–0,5 kg/week) zodat je vooral spier opbouwt en weinig vet."],
  ];
  return (
    <div className="glossary">
      {items.map(([t,d])=>(
        <div className="gterm" key={t}><span className="gt">{t}</span><span className="gd">{d}</span></div>
      ))}
    </div>
  );
}

/* ---------- Voortgang ---------- */
function Progress({muscles,exercises,logs,meso}){
  const setsByMg={};
  logs.filter(x=>x.week===meso.current_week).forEach(x=>{
    const ex=exercises.find(e=>e.id===x.exercise_id); if(!ex) return;
    setsByMg[ex.muscle_group_id]=(setsByMg[ex.muscle_group_id]||0)+1;
  });
  const anchors=exercises.filter(e=>e.is_anchor);
  const [pick,setPick]=useState((anchors[0]||exercises[0]||{}).id);
  const liftLogs=logs.filter(l=>l.exercise_id===Number(pick));
  const byCombo={};
  liftLogs.forEach(l=>{ const k=l.session_id!=null?"s"+l.session_id:l.week+"-"+l.day; const w=Number(l.weight);
    if(!byCombo[k]||w>byCombo[k].value) byCombo[k]={value:w,t:new Date(l.logged_at).getTime(),label:"w"+l.week}; });
  const liftData=Object.values(byCombo).sort((a,b)=>a.t-b.t).map(p=>({label:p.label,value:p.value}));
  const loadByWeek={};
  logs.forEach(l=>{ loadByWeek[l.week]=(loadByWeek[l.week]||0)+Number(l.weight)*l.reps; });
  const weekLoadData=Object.keys(loadByWeek).map(Number).sort((a,b)=>a-b).map(w=>({label:"w"+w,value:Math.round(loadByWeek[w])}));

  return (
    <>
      <div className="goalcard">
        <div className="gc-head"><span className="gc-wk">Week {meso.current_week}</span><span className="gc-title">{WEEK_GOALS[meso.current_week].t}</span></div>
        <p className="gc-body">{WEEK_GOALS[meso.current_week].d}</p>
      </div>

      <h3 className="section-h">Volume deze week</h3>
      <p className="section-sub">Elke balk toont hoeveel sets je déze week per spiergroep hebt gelogd. De streepjes MEV/MAV/MRV zijn drempels: vroeg in het blok mag je balk links staan (rond MEV), naar week 5 schuift 'ie naar rechts (richting MRV). De kleur zegt of het volume te weinig, productief, hoog of te veel is.</p>
      {muscles.map(m=> <Meter key={m.id} m={m} count={setsByMg[m.id]||0}/> )}
      <div className="legend">
        <span><i style={{background:"var(--under)"}}/>onder MEV — te weinig</span>
        <span><i style={{background:"var(--good)"}}/>MEV–MAV — productief</span>
        <span><i style={{background:"var(--accent)"}}/>MAV–MRV — hoog</span>
        <span><i style={{background:"var(--hot)"}}/>&gt; MRV — te veel</span>
      </div>
      <h3 className="section-h">Zwaarste set over tijd</h3>
      <p className="section-sub">Kies een oefening; de lijn toont je zwaarste set per training. Loopt 'ie omhoog, dan word je sterker — dat is progressive overload die werkt.</p>
      <div className="chartwrap">
        <select value={pick} onChange={e=>setPick(Number(e.target.value))}>
          {exercises.map(e=> <option key={e.id} value={e.id}>{e.name}</option>)}
        </select>
        <LineChart data={liftData} unit=" kg"/>
      </div>

      <h3 className="section-h">Totaal getild per week</h3>
      <p className="section-sub">Al je sets bij elkaar (gewicht × reps) per week. Dit is je totale werklast: die hoort in de opbouwweken te stijgen en in de deloadweek juist te dalen.</p>
      <div className="chartwrap"><LineChart data={weekLoadData} unit=" kg"/></div>
    </>
  );
}

function Meter({m,count}){
  const max=m.mrv, pct=v=>Math.min(100,v/max*100);
  const zone=count<m.mev?"on-under":count<=m.mav?"on-good":"on-hot";
  const fill=count>m.mrv?"var(--hot)":count<m.mev?"var(--under)":count<=m.mav?"var(--good)":"var(--accent)";
  const tick=(v,l)=>(
    <div style={{position:"absolute",left:pct(v)+"%",top:0,height:"100%",transform:"translateX(-0.5px)"}}>
      <div style={{width:1,height:"100%",background:"var(--line)"}}/>
      <div style={{position:"absolute",top:"100%",left:0,transform:"translateX(-50%)",marginTop:3,fontSize:9,color:"var(--muted)",fontFamily:"var(--mono)",whiteSpace:"nowrap"}}>{l}</div>
    </div>
  );
  return (
    <div className="meter">
      <div className="lbl"><span className="m">{m.name}</span><span className={"c "+zone}><b>{count}</b> / {m.mev}–{m.mrv} sets</span></div>
      <div style={{position:"relative",height:10,background:"var(--bg)",border:"1px solid var(--line)",borderRadius:6,overflow:"hidden"}}>
        <div style={{position:"absolute",left:0,top:0,height:"100%",width:pct(m.mev)+"%",background:"rgba(76,100,132,.18)"}}/>
        <div style={{position:"absolute",left:pct(m.mev)+"%",top:0,height:"100%",width:(pct(m.mav)-pct(m.mev))+"%",background:"rgba(79,191,154,.16)"}}/>
        <div style={{position:"absolute",left:pct(m.mav)+"%",top:0,height:"100%",width:(100-pct(m.mav))+"%",background:"rgba(232,176,75,.14)"}}/>
        <div style={{position:"absolute",left:0,top:0,height:"100%",width:pct(count)+"%",background:fill,opacity:.9}}/>
      </div>
      <div style={{position:"relative",height:14}}>{tick(m.mev,"MEV")}{tick(m.mav,"MAV")}{tick(m.mrv,"MRV")}</div>
    </div>
  );
}

function LineChart({data,goal,unit}){
  if(!data||data.length<2) return <div className="empty">Nog te weinig data — minstens twee metingen nodig.</div>;
  const W=500,H=170,P=30;
  const vals=data.map(d=>d.value);
  let min=Math.min(...vals),max=Math.max(...vals);
  if(goal!=null){ min=Math.min(min,goal); max=Math.max(max,goal); }
  const span=(max-min)||1;
  const x=i=>P+i*(W-2*P)/(data.length-1);
  const y=v=>H-P-(v-min)/span*(H-2*P);
  const path=data.map((d,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(d.value).toFixed(1)).join(" ");
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{display:"block"}}>
      {goal!=null && <><line x1={P} y1={y(goal)} x2={W-P} y2={y(goal)} stroke="var(--good)" strokeDasharray="4 4" opacity="0.7"/>
        <text x={W-P} y={y(goal)-5} fontSize="10" fill="var(--good)" textAnchor="end" fontFamily="var(--mono)">doel {goal}{unit||""}</text></>}
      <line x1={P} y1={H-P} x2={W-P} y2={H-P} stroke="var(--line)"/>
      <path d={path} fill="none" stroke="var(--accent)" strokeWidth="2"/>
      {data.map((d,i)=>(
        <g key={i}>
          <circle cx={x(i)} cy={y(d.value)} r="3.5" fill="var(--accent)"/>
          {(i===0||i===data.length-1||data.length<=8) && <text x={x(i)} y={y(d.value)-8} fontSize="10" fill="var(--text)" textAnchor="middle" fontFamily="var(--mono)">{fmt(d.value)}</text>}
          <text x={x(i)} y={H-P+14} fontSize="9" fill="var(--muted)" textAnchor="middle" fontFamily="var(--mono)">{d.label}</text>
        </g>
      ))}
    </svg>
  );
}

/* ---------- Gewicht (bulk-tracker) ---------- */
function Gewicht({bw,onLog,onDel}){
  const latest=bw.length?Number(bw[bw.length-1].weight):null;
  const [val,setVal]=useState(latest!=null?fmt(latest):"");
  useEffect(()=>{ if(latest!=null) setVal(fmt(latest)); },[bw.length]);
  const base=START_WEIGHT, goal=GOAL_WEIGHT;
  const progress=latest!=null?Math.max(0,Math.min(100,(latest-base)/(goal-base)*100)):0;
  const delta=latest!=null?latest-base:0;

  let rate=null;
  if(bw.length>=2){
    const f=bw[0], l=bw[bw.length-1];
    const weeks=(new Date(l.date)-new Date(f.date))/6048e5;
    if(weeks>=0.5) rate=(Number(l.weight)-Number(f.weight))/weeks;
  }
  const data=bw.map(b=>({label:b.date.slice(8,10)+"/"+b.date.slice(5,7),value:Number(b.weight)}));
  const recent=[...bw].reverse();
  const fmtD=s=>{ const d=new Date(s+"T00:00:00"); return d.toLocaleDateString("nl-NL",{weekday:"short",day:"numeric",month:"short"}); };

  const save=()=>{ const w=parseFloat(val); if(isNaN(w)){ alert("Vul een gewicht in."); return; } onLog(w); };

  return (
    <>
      <div className="bwhead">
        <div className="big">{latest!=null?fmt(latest):"—"}<small> kg</small></div>
        {latest!=null && <div className={"delta"+(delta>=0?" up":"")}>{delta>=0?"+":""}{fmt(delta)} kg sinds start · doel {goal} kg</div>}
        <div className="goalbar"><i style={{width:progress+"%"}}/></div>
        <div className="goalrow"><span>{base} kg</span><span>{goal} kg</span></div>
        {rate!=null && <div className="rate">Tempo: <b>{rate>=0?"+":""}{fmt(Math.round(rate*100)/100)} kg/week</b> · lean-bulk streven is 0,25–0,5 kg/week.</div>}
        <div className="logbw">
          <input inputMode="decimal" placeholder="Gewicht vandaag" value={val} onChange={e=>setVal(e.target.value)} aria-label="gewicht vandaag"/>
          <button className="btn btn-primary" onClick={save}>Weeg in</button>
        </div>
      </div>

      <h3 className="section-h">Gewicht over tijd</h3>
      {bw.length<2
        ? <p className="section-sub">Weeg je op minstens twee verschillende dagen in, dan verschijnt hier de grafiek. Meerdere keren op dezelfde dag wegen overschrijft de meting van die dag.</p>
        : <div className="chartwrap"><LineChart data={data} goal={goal} unit=" kg"/></div>}

      <h3 className="section-h">Metingen</h3>
      {recent.length===0
        ? <p className="section-sub">Nog geen metingen. Tik hierboven op “Weeg in”.</p>
        : recent.map(b=>(
            <div className="bwrow" key={b.id}>
              <span className="bw-date">{fmtD(b.date)}</span>
              <span className="bw-val">{fmt(b.weight)} kg</span>
              <button className="del" onClick={()=>onDel(b.id)} aria-label="Verwijder meting">✕</button>
            </div>
          ))}
    </>
  );
}

/* ---------- Schema import / export ---------- */
function SchemaTab({muscles,exercises,db,reload}){
  const [text,setText]=useState("");
  const [msg,setMsg]=useState(null);
  const example = `{
  "muscle_groups": [
    { "name": "Borst", "mv": 4, "mev": 8, "mav": 14, "mrv": 22 }
  ],
  "exercises": [
    { "name": "Bench press", "muscle_group": "Borst",
      "day": "A", "order_index": 1, "base_sets": 3,
      "rep_min": 6, "rep_max": 10,
      "is_anchor": true, "weight_increment": 2.5 }
  ]
}`;

  function exportCurrent(){
    const out={
      muscle_groups: muscles.map(m=>({name:m.name,mv:m.mv,mev:m.mev,mav:m.mav,mrv:m.mrv})),
      exercises: exercises.map(e=>({name:e.name,muscle_group:(muscles.find(m=>m.id===e.muscle_group_id)||{}).name,day:e.day,order_index:e.order_index,base_sets:e.base_sets,rep_min:e.rep_min,rep_max:e.rep_max,is_anchor:e.is_anchor,weight_increment:Number(e.weight_increment)}))
    };
    setText(JSON.stringify(out,null,2)); setMsg({t:"Huidig schema geladen — pas aan en importeer.",ok:true});
  }

  async function doImport(replace){
    setMsg(null);
    let parsed;
    try{ parsed=JSON.parse(text); }catch(e){ setMsg({t:"Ongeldige JSON: "+e.message,ok:false}); return; }
    const exs=parsed.exercises||(Array.isArray(parsed)?parsed:null);
    if(!exs||!exs.length){ setMsg({t:'Geen "exercises" gevonden.',ok:false}); return; }
    for(const e of exs){ if(!e.name||!["A","B","C"].includes(e.day)){ setMsg({t:'Elke oefening heeft "name" en "day" (A/B/C) nodig.',ok:false}); return; } }
    if(replace && !window.confirm("Huidige oefeningen vervangen? Je logs blijven bewaard.")) return;
    try{
      if(parsed.muscle_groups&&parsed.muscle_groups.length){
        await db.from("muscle_groups").upsert(parsed.muscle_groups.map(m=>({name:m.name,mv:m.mv??4,mev:m.mev??8,mav:m.mav??14,mrv:m.mrv??22})),{onConflict:"name"});
      }
      let r=await db.from("muscle_groups").select("*");
      let map=Object.fromEntries(r.data.map(m=>[m.name,m.id]));
      const missing=[...new Set(exs.map(e=>e.muscle_group).filter(n=>n&&!(n in map)))];
      if(missing.length){
        await db.from("muscle_groups").insert(missing.map(n=>({name:n,mv:4,mev:8,mav:14,mrv:22})));
        r=await db.from("muscle_groups").select("*"); map=Object.fromEntries(r.data.map(m=>[m.name,m.id]));
      }
      if(replace) await db.from("exercises").update({active:false}).eq("active",true);
      const rows=exs.map((e,i)=>({name:e.name,muscle_group_id:e.muscle_group?map[e.muscle_group]:null,day:e.day,order_index:e.order_index??(i+1),base_sets:e.base_sets??3,rep_min:e.rep_min??8,rep_max:e.rep_max??12,is_anchor:!!e.is_anchor,weight_increment:e.weight_increment??2.5,active:true}));
      const ins=await db.from("exercises").insert(rows);
      if(ins.error) throw ins.error;
      setMsg({t:`${rows.length} oefeningen geïmporteerd${replace?" — schema vervangen.":"."}`,ok:true});
      await reload();
    }catch(e){ setMsg({t:"Import mislukt: "+(e.message||e),ok:false}); }
  }

  return (
    <div className="imp">
      <h3 className="section-h">Nieuw schema importeren</h3>
      <p className="section-sub">Plak je oefeningen als JSON. "Vervangen" zet je huidige schema opzij (logs blijven bewaard); "Toevoegen" plakt erbij.</p>
      <textarea placeholder="Plak hier je JSON…" value={text} onChange={e=>setText(e.target.value)}/>
      <div className="row">
        <button className="btn btn-primary" onClick={()=>doImport(true)}>Vervang schema</button>
        <button className="btn btn-ghost" onClick={()=>doImport(false)}>Voeg toe</button>
        <button className="btn btn-ghost" onClick={exportCurrent}>Exporteer huidig</button>
      </div>
      {msg && <div className={"msg "+(msg.ok?"ok":"bad")}>{msg.t}</div>}
      <h3 className="section-h">Formaat</h3>
      <pre>{example}</pre>
      <p className="section-sub">muscle_groups is optioneel — onbekende spiergroepen krijgen standaard landmarks die je later kunt bijstellen. weight_increment is 2.5 (boven) of 5 (onder).</p>
    </div>
  );
}

function Setup(){
  return (
    <div className="wrap">
      <header className="status"><div className="brand">RP · Logboek</div></header>
      <div className="setup">
        <h2>Bijna klaar — vul je sleutels in</h2>
        <p>Open <code>index.html</code> en vervang bovenin het script <code>SUPABASE_URL</code> en <code>SUPABASE_ANON_KEY</code>. Beide vind je in Supabase onder <b>Project Settings → API</b>.</p>
        <p style={{marginTop:12}}>Zorg dat je eerst <code>schema.sql</code> hebt gedraaid in de SQL Editor. Je bulk-doelen (<code>START_WEIGHT</code>, <code>GOAL_WEIGHT</code>) staan er vlak onder.</p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
