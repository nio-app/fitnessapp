<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>RP Logboek</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0F131B; --panel:#161C27; --panel2:#1D2532; --line:#2A3441;
    --text:#E7ECF3; --muted:#8A97A8;
    --accent:#E8B04B; --good:#4FBF9A; --under:#4C6484; --hot:#E0605B;
    --display:"Space Grotesk",sans-serif; --body:"Inter",sans-serif; --mono:"JetBrains Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px 96px}
  h1,h2,h3{font-family:var(--display);margin:0}
  .mono{font-family:var(--mono)}
  button{font-family:var(--body);cursor:pointer;border:none;color:inherit;background:none}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  input,select,textarea{font-family:var(--mono);background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:15px;width:100%}
  input:disabled{opacity:.4}

  header.status{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg),var(--bg) 78%,transparent);padding:18px 0 12px}
  .brand{font-family:var(--mono);font-size:11px;letter-spacing:.32em;color:var(--muted);text-transform:uppercase}
  .weekline{display:flex;align-items:baseline;gap:10px;margin-top:6px}
  .weekline .wk{font-family:var(--display);font-weight:700;font-size:30px;line-height:1}
  .weekline .wk small{color:var(--muted);font-weight:500;font-size:18px}
  .phase{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .phase.deload{color:var(--accent)}
  .rirbadge{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:13px;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:5px 11px;white-space:nowrap}
  .progressbar{height:3px;background:var(--line);border-radius:2px;margin-top:14px;overflow:hidden}
  .progressbar>i{display:block;height:100%;background:var(--accent);transition:width .4s ease}

  .tabs{display:flex;gap:3px;margin:16px 0 4px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:4px}
  .tabs button{flex:1;padding:8px 4px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted)}
  .tabs button.on{background:var(--panel2);color:var(--text)}

  .dayhead{display:flex;align-items:center;gap:10px;margin:18px 2px 2px}
  .dayhead .tag{font-family:var(--mono);font-weight:700;font-size:13px;background:var(--accent);color:#141414;border-radius:7px;padding:3px 9px}
  .dayhead h2{font-size:16px;font-weight:600;flex:1}
  .dayhead .cnt{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .daysub{color:var(--muted);font-size:13px;margin:2px 2px 10px}

  /* session bar */
  .sessbar{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:6px 0 14px}
  .sessbar.live{border-color:var(--accent)}
  .sessbar .live-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,176,75,.5)}70%{box-shadow:0 0 0 8px rgba(232,176,75,0)}100%{box-shadow:0 0 0 0 rgba(232,176,75,0)}}
  .sessbar .t{font-family:var(--mono);font-size:19px;font-weight:700;letter-spacing:.03em}
  .sessbar .sub{font-size:12px;color:var(--muted)}
  .sessbar .sp{flex:1}
  .chip{border-radius:9px;padding:10px 14px;font-weight:600;font-size:14px;white-space:nowrap}
  .chip-in{background:var(--accent);color:#141414}
  .chip-out{background:var(--panel2);border:1px solid var(--line);color:var(--text)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;transition:opacity .2s}
  .card.checked{opacity:.5}
  .card .top{display:flex;align-items:center;gap:8px}
  .card .idx{font-family:var(--mono);color:var(--muted);font-size:13px}
  .card .name{font-family:var(--display);font-weight:600;font-size:17px;flex:1}
  .card .anchor{color:var(--accent)}
  .card .mg{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px;white-space:nowrap}
  .tick{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);color:transparent;font-size:15px;display:flex;align-items:center;justify-content:center;flex:none}
  .tick.on{background:var(--good);border-color:var(--good);color:#0F131B;font-weight:700}
  .meta{font-family:var(--mono);font-size:13px;margin:9px 0 2px;display:flex;gap:6px;flex-wrap:wrap}
  .meta .dot{color:var(--line)}
  .prev{font-size:12.5px;color:var(--muted);margin:6px 0 2px}
  .prev b{color:var(--text);font-family:var(--mono);font-weight:500}
  .cue{font-size:12.5px;color:var(--good);margin:4px 0 10px}
  .cue.deloadcue{color:var(--accent)}
  .hint{font-size:12.5px;color:var(--muted);margin:8px 0 2px;font-style:italic}

  .colhead{display:grid;grid-template-columns:26px 1fr 1fr 1fr auto;gap:7px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;padding:0 2px}
  .colhead span:first-child{text-align:center}
  .setrow{display:grid;grid-template-columns:26px 1fr 1fr 1fr auto;gap:7px;align-items:center;margin-bottom:7px}
  .setrow .sn{font-family:var(--mono);color:var(--muted);font-size:13px;text-align:center}
  .setrow input{padding:8px}
  .savebtn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-weight:600;font-size:13px}
  .savebtn:active{transform:translateY(1px)}
  .logged{display:grid;grid-template-columns:26px 1fr auto;gap:7px;align-items:center;background:var(--panel2);border-radius:9px;padding:8px 10px;margin-bottom:7px}
  .logged .val{font-family:var(--mono);font-size:14px}
  .logged .val .rir{color:var(--muted)}
  .logged .del{color:var(--muted);font-size:16px;padding:2px 6px;line-height:1}
  .logged .del:hover{color:var(--hot)}

  .actions{display:flex;flex-direction:column;gap:9px;margin-top:6px}
  .btn{border-radius:11px;padding:13px;font-weight:600;font-size:15px;text-align:center}
  .btn-primary{background:var(--accent);color:#141414}
  .btn-ghost{background:var(--panel);border:1px solid var(--line);color:var(--text)}
  .btn:active{transform:translateY(1px)}

  .section-h{font-family:var(--display);font-weight:600;font-size:15px;margin:20px 2px 4px}
  .section-sub{color:var(--muted);font-size:12.5px;margin:0 2px 14px}
  .meter{margin-bottom:16px}
  .meter .lbl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
  .meter .lbl .m{font-family:var(--display);font-weight:600;font-size:14px}
  .meter .lbl .c{font-family:var(--mono);font-size:13px;color:var(--muted)}
  .meter .lbl .c b{color:var(--text)} .c.on-good b{color:var(--good)} .c.on-hot b{color:var(--hot)} .c.on-under b{color:var(--under)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:2px 2px 16px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .chartwrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:6px}
  .chartwrap select{margin-bottom:12px}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:22px 0}

  /* gewicht */
  .bwhead{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:6px}
  .bwhead .big{font-family:var(--display);font-weight:700;font-size:40px;line-height:1}
  .bwhead .big small{font-size:18px;color:var(--muted);font-weight:500}
  .bwhead .delta{font-family:var(--mono);font-size:14px;margin-top:4px}
  .bwhead .delta.up{color:var(--good)}
  .goalbar{height:9px;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:16px 0 6px}
  .goalbar>i{display:block;height:100%;background:var(--good)}
  .goalrow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .rate{font-size:12.5px;color:var(--muted);margin-top:12px}
  .rate b{color:var(--text)}
  .logbw{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}

  /* schema/import */
  .imp textarea{min-height:180px;font-size:12.5px;line-height:1.5;resize:vertical}
  .imp .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .imp .row .btn{flex:1;min-width:130px}
  .imp pre{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted);line-height:1.5}
  .imp .msg{font-size:13px;margin-top:10px;font-family:var(--mono)}
  .imp .msg.ok{color:var(--good)} .imp .msg.bad{color:var(--hot)}

  .setup{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:40px}
  .setup h2{font-size:18px;margin-bottom:8px}
  .setup p{color:var(--muted);font-size:14px;line-height:1.55}
  .setup code{font-family:var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12.5px;color:var(--accent)}
  .center{min-height:60vh;display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .err{color:var(--hot);font-size:13px;margin-top:10px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const {useState, useEffect} = React;

/* ==== 1. VUL HIER JE SUPABASE-GEGEVENS IN ==== */
const SUPABASE_URL      = "https://JOUW-PROJECT.supabase.co";
const SUPABASE_ANON_KEY = "JOUW-ANON-KEY";

/* ==== 2. Je bulk-doelen (pas gerust aan) ==== */
const START_WEIGHT = 100;   // startgewicht bulk
const GOAL_WEIGHT  = 105;   // doelgewicht
/* ============================================= */

const RIR_BY_WEEK = {1:"3", 2:"2–3", 3:"2", 4:"1", 5:"0–1", 6:"4–5"};
const DAY_NAMES = {A:"Borst · Triceps · Schouders", B:"Rug · Biceps", C:"Benen"};
const nextDay = d => (d==="A"?"B":d==="B"?"C":"A");
const fmt = n => (Math.round(Number(n)*100)/100).toString();
const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };

const configured = !SUPABASE_URL.includes("JOUW-PROJECT") && !SUPABASE_ANON_KEY.includes("JOUW-ANON");
const db = configured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

function setsForWeek(ex, week){
  if(week>=6) return Math.max(1, Math.ceil(ex.base_sets/2));
  let s = ex.base_sets;
  if(ex.is_anchor && week>=3) s++;
  if(ex.is_anchor && week>=5) s++;
  return s;
}

function prevAndCue(ex, meso, logs, activeSessionId){
  const past = logs
    .filter(x => x.exercise_id===ex.id && !(activeSessionId && x.session_id===activeSessionId))
    .sort((a,b)=> new Date(b.logged_at)-new Date(a.logged_at));
  if(past.length===0) return {prev:[], cue:"Eerste keer — kies een gewicht waarbij je net de onderkant van de rep-range haalt.", sug:null};
  const gkey = x => x.session_id!=null ? "s"+x.session_id : x.week+"-"+x.day;
  const k = gkey(past[0]);
  const prev = past.filter(x=>gkey(x)===k).sort((a,b)=>a.set_number-b.set_number);
  const top = Math.max(...prev.map(s=>Number(s.weight)));
  const repsAtTop = Math.min(...prev.filter(s=>Number(s.weight)===top).map(s=>s.reps));
  let sug, cue, deload=false;
  if(meso.current_week>=6){ sug=Math.round((top*0.65)/2.5)*2.5; cue="Deload — lichter, en stop elke set op 4–5 RIR."; deload=true; }
  else if(repsAtTop>=ex.rep_max){ sug=top+Number(ex.weight_increment); cue=`Top van de range gehaald → +${fmt(ex.weight_increment)} kg, mik op ${ex.rep_min}+ reps.`; }
  else { sug=top; cue=`Zelfde gewicht, mik op ${repsAtTop+1}+ reps (richting ${ex.rep_max}).`; }
  return {prev, cue, deload, sug};
}

/* ==================== App ==================== */
function App(){
  const [st,setSt] = useState({loading:true,error:null});
  const [muscles,setMuscles]=useState([]);
  const [exercises,setExercises]=useState([]);
  const [meso,setMeso]=useState(null);
  const [logs,setLogs]=useState([]);
  const [session,setSession]=useState(null);
  const [checks,setChecks]=useState([]);
  const [bw,setBw]=useState([]);
  const [tab,setTab]=useState("vandaag");

  async function loadAll(){
    try{
      const [mg,ex] = await Promise.all([
        db.from("muscle_groups").select("*").order("id"),
        db.from("exercises").select("*").eq("active",true).order("order_index"),
      ]);
      if(mg.error) throw mg.error; if(ex.error) throw ex.error;
      const ms = await db.from("mesocycles").select("*").eq("active",true).order("id",{ascending:false}).limit(1);
      if(ms.error) throw ms.error;
      const m = (ms.data && ms.data[0]) || null;
      let lg=[], sess=null, chk=[];
      if(m){
        const l = await db.from("set_logs").select("*").eq("mesocycle_id",m.id).order("logged_at");
        if(l.error) throw l.error; lg=l.data||[];
        const s = await db.from("sessions").select("*").is("ended_at",null).order("id",{ascending:false}).limit(1);
        if(s.error) throw s.error; sess=(s.data&&s.data[0])||null;
        if(sess){ const c=await db.from("session_checks").select("*").eq("session_id",sess.id); chk=c.data||[]; }
      }
      const b = await db.from("bodyweight_logs").select("*").order("date");
      if(b.error) throw b.error;
      setMuscles(mg.data||[]); setExercises(ex.data||[]); setMeso(m); setLogs(lg);
      setSession(sess); setChecks(chk); setBw(b.data||[]);
      setSt({loading:false,error:null});
    }catch(e){ setSt({loading:false,error:e.message||String(e)}); }
  }
  useEffect(()=>{ if(configured) loadAll(); },[]);

  async function startMeso(){
    await db.from("mesocycles").update({active:false}).eq("active",true);
    await db.from("mesocycles").insert({name:"Blok "+new Date().toLocaleDateString("nl-NL"),current_week:1,current_day:"A",active:true});
    await loadAll();
  }
  async function checkIn(){
    await db.from("sessions").insert({mesocycle_id:meso.id,week:meso.current_week,day:meso.current_day});
    await loadAll();
  }
  async function checkOut(){
    if(session) await db.from("sessions").update({ended_at:new Date().toISOString()}).eq("id",session.id);
    await db.from("mesocycles").update({current_day:nextDay(meso.current_day)}).eq("id",meso.id);
    await loadAll();
  }
  async function toggleCheck(exId){
    const ex = checks.find(c=>c.exercise_id===exId);
    if(ex) await db.from("session_checks").delete().eq("id",ex.id);
    else await db.from("session_checks").insert({session_id:session.id,exercise_id:exId});
    await loadAll();
  }
  async function logSet(ex,setNumber,weight,reps,rir){
    const r=await db.from("set_logs").insert({mesocycle_id:meso.id,session_id:session?session.id:null,week:meso.current_week,day:meso.current_day,exercise_id:ex.id,set_number:setNumber,weight,reps,rir});
    if(r.error){ alert("Opslaan mislukt: "+r.error.message); return; }
    await loadAll();
  }
  async function delLog(id){ await db.from("set_logs").delete().eq("id",id); await loadAll(); }
  async function advanceWeek(){ if(meso.current_week<6){ await db.from("mesocycles").update({current_week:meso.current_week+1}).eq("id",meso.id); await loadAll(); } }
  async function logBodyweight(weight){
    const d=todayStr();
    const ex=bw.find(x=>x.date===d);
    if(ex) await db.from("bodyweight_logs").update({weight}).eq("id",ex.id);
    else await db.from("bodyweight_logs").insert({date:d,weight});
    await loadAll();
  }

  if(!configured) return <Setup/>;
  if(st.loading) return <div className="center">Laden…</div>;
  if(st.error) return <div className="wrap"><div className="setup"><h2>Verbindingsfout</h2><p>Controleer je Supabase-URL, de anon-key en of je het schema hebt gedraaid.</p><div className="err mono">{st.error}</div></div></div>;

  if(!meso) return (
    <div className="wrap">
      <header className="status"><div className="brand">RP · Logboek</div></header>
      <div className="setup"><h2>Nog geen mesocyclus</h2><p>Start je eerste blok van 6 weken (week 1, dag A).</p>
        <div style={{marginTop:16}}><button className="btn btn-primary" style={{width:"100%"}} onClick={startMeso}>Start mesocyclus</button></div></div>
    </div>
  );

  const phase = meso.current_week>=6 ? "Deload" : "Accumulatie";
  const todayEx = exercises.filter(e=>e.day===meso.current_day);
  const checkedIds = new Set(checks.map(c=>c.exercise_id));

  return (
    <div className="wrap">
      <header className="status">
        <div className="brand">RP · Logboek</div>
        <div className="weekline">
          <div className="wk">Week {meso.current_week}<small> / 6</small></div>
          <div className={"phase"+(phase==="Deload"?" deload":"")}>{phase}</div>
          <div className="rirbadge">RIR {RIR_BY_WEEK[meso.current_week]}</div>
        </div>
        <div className="progressbar"><i style={{width:(meso.current_week/6*100)+"%"}}/></div>
      </header>

      <div className="tabs">
        <button className={tab==="vandaag"?"on":""} onClick={()=>setTab("vandaag")}>Vandaag</button>
        <button className={tab==="voortgang"?"on":""} onClick={()=>setTab("voortgang")}>Voortgang</button>
        <button className={tab==="gewicht"?"on":""} onClick={()=>setTab("gewicht")}>Gewicht</button>
        <button className={tab==="schema"?"on":""} onClick={()=>setTab("schema")}>Schema</button>
      </div>

      {tab==="vandaag" && (
        <>
          <div className="dayhead">
            <span className="tag">DAG {meso.current_day}</span>
            <h2>{DAY_NAMES[meso.current_day]}</h2>
            <span className="cnt">{checkedIds.size}/{todayEx.length} ✓</span>
          </div>
          <p className="daysub">Rotatie schuift door na uitchecken.</p>

          {session ? (
            <div className="sessbar live">
              <span className="live-dot"/>
              <div><div className="t"><Timer start={session.started_at}/></div><div className="sub">Bezig — Dag {session.day}</div></div>
              <span className="sp"/>
              <button className="chip chip-out" onClick={checkOut}>Check uit ✓</button>
            </div>
          ) : (
            <div className="sessbar">
              <div><div className="sub">Klaar om te starten</div></div>
              <span className="sp"/>
              <button className="chip chip-in" onClick={checkIn}>▶ Check in — Dag {meso.current_day}</button>
            </div>
          )}

          {todayEx.map(ex=>(
            <ExerciseCard key={ex.id} ex={ex} meso={meso} session={session} logs={logs}
              checked={checkedIds.has(ex.id)} muscle={muscles.find(m=>m.id===ex.muscle_group_id)}
              onLog={logSet} onDel={delLog} onToggle={toggleCheck}/>
          ))}

          <div className="actions">
            {meso.current_week<6
              ? <button className="btn btn-ghost" onClick={advanceWeek}>Week afronden → Week {meso.current_week+1}</button>
              : <button className="btn btn-ghost" onClick={startMeso}>Deload klaar → Nieuwe mesocyclus</button>}
          </div>
        </>
      )}

      {tab==="voortgang" && <Progress muscles={muscles} exercises={exercises} logs={logs} meso={meso}/>}
      {tab==="gewicht" && <Gewicht bw={bw} onLog={logBodyweight}/>}
      {tab==="schema" && <SchemaTab muscles={muscles} exercises={exercises} db={db} reload={loadAll}/>}
    </div>
  );
}

function Timer({start}){
  const [now,setNow]=useState(Date.now());
  useEffect(()=>{ const id=setInterval(()=>setNow(Date.now()),1000); return ()=>clearInterval(id); },[]);
  const s=Math.max(0,Math.floor((now-new Date(start).getTime())/1000));
  const p=n=>String(n).padStart(2,"0");
  return <span>{p(Math.floor(s/3600))}:{p(Math.floor(s%3600/60))}:{p(s%60)}</span>;
}

/* ---------- Oefeningkaart ---------- */
function ExerciseCard({ex,meso,session,logs,checked,muscle,onLog,onDel,onToggle}){
  const active=!!session;
  const target=setsForWeek(ex,meso.current_week);
  const rir=RIR_BY_WEEK[meso.current_week];
  const {prev,cue,deload,sug}=prevAndCue(ex,meso,logs,session?session.id:null);
  const todays=active ? logs.filter(x=>x.exercise_id===ex.id && x.session_id===session.id).sort((a,b)=>a.set_number-b.set_number) : [];
  const rirDefault=parseInt(rir,10);
  const [draft,setDraft]=useState({});
  const upd=(n,f,v)=>setDraft(d=>({...d,[n]:{...(d[n]||{}),[f]:v}}));
  const save=(n)=>{
    const d=draft[n]||{};
    const w=parseFloat(d.weight!=null&&d.weight!==""?d.weight:(sug??""));
    const r=parseInt(d.reps,10);
    const ri=d.rir!=null&&d.rir!==""?parseInt(d.rir,10):rirDefault;
    if(isNaN(w)||isNaN(r)){ alert("Vul gewicht en reps in."); return; }
    onLog(ex,n,w,r,ri); setDraft(x=>({...x,[n]:{}}));
  };

  return (
    <div className={"card"+(checked?" checked":"")}>
      <div className="top">
        <span className="idx">{ex.order_index}</span>
        <span className="name">{ex.name}{ex.is_anchor && <span className="anchor" title="Volume-ramp"> ★</span>}</span>
        <span className="mg">{muscle?muscle.name:""}</span>
        <button className={"tick"+(checked?" on":"")} disabled={!active} onClick={()=>onToggle(ex.id)}
          aria-label={checked?"Vink uit":"Vink af"} title={active?"Afvinken":"Check eerst in"}>✓</button>
      </div>
      <div className="meta"><span>{target} sets</span><span className="dot">·</span><span>{ex.rep_min}–{ex.rep_max} reps</span><span className="dot">·</span><span>RIR {rir}</span></div>
      <div className="prev">{prev.length ? <>Vorige: <b>{prev.map(s=>fmt(s.weight)+"×"+s.reps).join(", ")}</b></> : "Vorige: —"}</div>
      <div className={"cue"+(deload?" deloadcue":"")}>{cue}</div>

      {!active ? <div className="hint">Check in om je sets te loggen.</div> : (
        <>
          <div className="colhead"><span>#</span><span>kg</span><span>reps</span><span>rir</span><span></span></div>
          {Array.from({length:target}).map((_,i)=>{
            const n=i+1; const done=todays.find(t=>t.set_number===n);
            if(done) return (
              <div className="logged" key={n}>
                <span className="sn mono">{n}</span>
                <span className="val">{fmt(done.weight)} kg × {done.reps} <span className="rir">@ {done.rir} RIR</span></span>
                <button className="del" onClick={()=>onDel(done.id)} aria-label="Verwijder set">✕</button>
              </div>
            );
            const d=draft[n]||{};
            return (
              <div className="setrow" key={n}>
                <span className="sn">{n}</span>
                <input inputMode="decimal" placeholder={sug!=null?fmt(sug):"kg"} value={d.weight??""} onChange={e=>upd(n,"weight",e.target.value)} aria-label="gewicht"/>
                <input inputMode="numeric" placeholder={String(ex.rep_min)} value={d.reps??""} onChange={e=>upd(n,"reps",e.target.value)} aria-label="reps"/>
                <input inputMode="numeric" placeholder={String(rirDefault)} value={d.rir??""} onChange={e=>upd(n,"rir",e.target.value)} aria-label="rir"/>
                <button className="savebtn" onClick={()=>save(n)}>Log</button>
              </div>
            );
          })}
        </>
      )}
    </div>
  );
}

/* ---------- Voortgang ---------- */
function Progress({muscles,exercises,logs,meso}){
  const setsByMg={};
  logs.filter(x=>x.week===meso.current_week).forEach(x=>{
    const ex=exercises.find(e=>e.id===x.exercise_id); if(!ex) return;
    setsByMg[ex.muscle_group_id]=(setsByMg[ex.muscle_group_id]||0)+1;
  });
  const anchors=exercises.filter(e=>e.is_anchor);
  const [pick,setPick]=useState((anchors[0]||exercises[0]||{}).id);
  const liftLogs=logs.filter(l=>l.exercise_id===Number(pick));
  const byCombo={};
  liftLogs.forEach(l=>{ const k=l.session_id!=null?"s"+l.session_id:l.week+"-"+l.day; const w=Number(l.weight);
    if(!byCombo[k]||w>byCombo[k].value) byCombo[k]={value:w,t:new Date(l.logged_at).getTime(),label:"w"+l.week}; });
  const liftData=Object.values(byCombo).sort((a,b)=>a.t-b.t).map(p=>({label:p.label,value:p.value}));

  return (
    <>
      <h3 className="section-h">Volume deze week</h3>
      <p className="section-sub">Sets per spiergroep t.o.v. je landmarks. Groen = productief (MEV–MAV), amber = hoog (MAV–MRV).</p>
      {muscles.map(m=> <Meter key={m.id} m={m} count={setsByMg[m.id]||0}/> )}
      <div className="legend">
        <span><i style={{background:"var(--under)"}}/>onder MEV</span>
        <span><i style={{background:"var(--good)"}}/>MEV–MAV</span>
        <span><i style={{background:"var(--accent)"}}/>MAV–MRV</span>
        <span><i style={{background:"var(--hot)"}}/>&gt; MRV</span>
      </div>
      <h3 className="section-h">Zwaarste set over tijd</h3>
      <div className="chartwrap">
        <select value={pick} onChange={e=>setPick(Number(e.target.value))}>
          {exercises.map(e=> <option key={e.id} value={e.id}>{e.name}</option>)}
        </select>
        <LineChart data={liftData} unit=" kg"/>
      </div>
    </>
  );
}

function Meter({m,count}){
  const max=m.mrv, pct=v=>Math.min(100,v/max*100);
  const zone=count<m.mev?"on-under":count<=m.mav?"on-good":"on-hot";
  const fill=count>m.mrv?"var(--hot)":count<m.mev?"var(--under)":count<=m.mav?"var(--good)":"var(--accent)";
  const tick=(v,l)=>(
    <div style={{position:"absolute",left:pct(v)+"%",top:0,height:"100%",transform:"translateX(-0.5px)"}}>
      <div style={{width:1,height:"100%",background:"var(--line)"}}/>
      <div style={{position:"absolute",top:"100%",left:0,transform:"translateX(-50%)",marginTop:3,fontSize:9,color:"var(--muted)",fontFamily:"var(--mono)",whiteSpace:"nowrap"}}>{l}</div>
    </div>
  );
  return (
    <div className="meter">
      <div className="lbl"><span className="m">{m.name}</span><span className={"c "+zone}><b>{count}</b> / {m.mev}–{m.mrv} sets</span></div>
      <div style={{position:"relative",height:10,background:"var(--bg)",border:"1px solid var(--line)",borderRadius:6,overflow:"hidden"}}>
        <div style={{position:"absolute",left:0,top:0,height:"100%",width:pct(m.mev)+"%",background:"rgba(76,100,132,.18)"}}/>
        <div style={{position:"absolute",left:pct(m.mev)+"%",top:0,height:"100%",width:(pct(m.mav)-pct(m.mev))+"%",background:"rgba(79,191,154,.16)"}}/>
        <div style={{position:"absolute",left:pct(m.mav)+"%",top:0,height:"100%",width:(100-pct(m.mav))+"%",background:"rgba(232,176,75,.14)"}}/>
        <div style={{position:"absolute",left:0,top:0,height:"100%",width:pct(count)+"%",background:fill,opacity:.9}}/>
      </div>
      <div style={{position:"relative",height:14}}>{tick(m.mev,"MEV")}{tick(m.mav,"MAV")}{tick(m.mrv,"MRV")}</div>
    </div>
  );
}

function LineChart({data,goal,unit}){
  if(!data||data.length<2) return <div className="empty">Nog te weinig data — minstens twee metingen nodig.</div>;
  const W=500,H=170,P=30;
  const vals=data.map(d=>d.value);
  let min=Math.min(...vals),max=Math.max(...vals);
  if(goal!=null){ min=Math.min(min,goal); max=Math.max(max,goal); }
  const span=(max-min)||1;
  const x=i=>P+i*(W-2*P)/(data.length-1);
  const y=v=>H-P-(v-min)/span*(H-2*P);
  const path=data.map((d,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(d.value).toFixed(1)).join(" ");
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{display:"block"}}>
      {goal!=null && <><line x1={P} y1={y(goal)} x2={W-P} y2={y(goal)} stroke="var(--good)" strokeDasharray="4 4" opacity="0.7"/>
        <text x={W-P} y={y(goal)-5} fontSize="10" fill="var(--good)" textAnchor="end" fontFamily="var(--mono)">doel {goal}{unit||""}</text></>}
      <line x1={P} y1={H-P} x2={W-P} y2={H-P} stroke="var(--line)"/>
      <path d={path} fill="none" stroke="var(--accent)" strokeWidth="2"/>
      {data.map((d,i)=>(
        <g key={i}>
          <circle cx={x(i)} cy={y(d.value)} r="3.5" fill="var(--accent)"/>
          {(i===0||i===data.length-1||data.length<=8) && <text x={x(i)} y={y(d.value)-8} fontSize="10" fill="var(--text)" textAnchor="middle" fontFamily="var(--mono)">{fmt(d.value)}</text>}
          <text x={x(i)} y={H-P+14} fontSize="9" fill="var(--muted)" textAnchor="middle" fontFamily="var(--mono)">{d.label}</text>
        </g>
      ))}
    </svg>
  );
}

/* ---------- Gewicht (bulk-tracker) ---------- */
function Gewicht({bw,onLog}){
  const latest=bw.length?Number(bw[bw.length-1].weight):null;
  const [val,setVal]=useState(latest!=null?fmt(latest):"");
  useEffect(()=>{ if(latest!=null) setVal(fmt(latest)); },[bw.length]);
  const base=START_WEIGHT, goal=GOAL_WEIGHT;
  const progress=latest!=null?Math.max(0,Math.min(100,(latest-base)/(goal-base)*100)):0;
  const delta=latest!=null?latest-base:0;

  let rate=null;
  if(bw.length>=2){
    const f=bw[0], l=bw[bw.length-1];
    const weeks=(new Date(l.date)-new Date(f.date))/6048e5;
    if(weeks>=0.5) rate=(Number(l.weight)-Number(f.weight))/weeks;
  }
  const data=bw.map(b=>({label:b.date.slice(8,10)+"/"+b.date.slice(5,7),value:Number(b.weight)}));

  const save=()=>{ const w=parseFloat(val); if(isNaN(w)){ alert("Vul een gewicht in."); return; } onLog(w); };

  return (
    <>
      <div className="bwhead">
        <div className="big">{latest!=null?fmt(latest):"—"}<small> kg</small></div>
        {latest!=null && <div className={"delta"+(delta>=0?" up":"")}>{delta>=0?"+":""}{fmt(delta)} kg sinds start · doel {goal} kg</div>}
        <div className="goalbar"><i style={{width:progress+"%"}}/></div>
        <div className="goalrow"><span>{base} kg</span><span>{goal} kg</span></div>
        {rate!=null && <div className="rate">Tempo: <b>{rate>=0?"+":""}{fmt(Math.round(rate*100)/100)} kg/week</b> · lean-bulk streven is 0,25–0,5 kg/week.</div>}
        <div className="logbw">
          <input inputMode="decimal" placeholder="Gewicht vandaag" value={val} onChange={e=>setVal(e.target.value)} aria-label="gewicht vandaag"/>
          <button className="btn btn-primary" onClick={save}>Weeg in</button>
        </div>
      </div>
      <h3 className="section-h">Gewicht over tijd</h3>
      <div className="chartwrap"><LineChart data={data} goal={goal} unit=" kg"/></div>
    </>
  );
}

/* ---------- Schema import / export ---------- */
function SchemaTab({muscles,exercises,db,reload}){
  const [text,setText]=useState("");
  const [msg,setMsg]=useState(null);
  const example = `{
  "muscle_groups": [
    { "name": "Borst", "mv": 4, "mev": 8, "mav": 14, "mrv": 22 }
  ],
  "exercises": [
    { "name": "Bench press", "muscle_group": "Borst",
      "day": "A", "order_index": 1, "base_sets": 3,
      "rep_min": 6, "rep_max": 10,
      "is_anchor": true, "weight_increment": 2.5 }
  ]
}`;

  function exportCurrent(){
    const out={
      muscle_groups: muscles.map(m=>({name:m.name,mv:m.mv,mev:m.mev,mav:m.mav,mrv:m.mrv})),
      exercises: exercises.map(e=>({name:e.name,muscle_group:(muscles.find(m=>m.id===e.muscle_group_id)||{}).name,day:e.day,order_index:e.order_index,base_sets:e.base_sets,rep_min:e.rep_min,rep_max:e.rep_max,is_anchor:e.is_anchor,weight_increment:Number(e.weight_increment)}))
    };
    setText(JSON.stringify(out,null,2)); setMsg({t:"Huidig schema geladen — pas aan en importeer.",ok:true});
  }

  async function doImport(replace){
    setMsg(null);
    let parsed;
    try{ parsed=JSON.parse(text); }catch(e){ setMsg({t:"Ongeldige JSON: "+e.message,ok:false}); return; }
    const exs=parsed.exercises||(Array.isArray(parsed)?parsed:null);
    if(!exs||!exs.length){ setMsg({t:'Geen "exercises" gevonden.',ok:false}); return; }
    for(const e of exs){ if(!e.name||!["A","B","C"].includes(e.day)){ setMsg({t:'Elke oefening heeft "name" en "day" (A/B/C) nodig.',ok:false}); return; } }
    if(replace && !window.confirm("Huidige oefeningen vervangen? Je logs blijven bewaard.")) return;
    try{
      if(parsed.muscle_groups&&parsed.muscle_groups.length){
        await db.from("muscle_groups").upsert(parsed.muscle_groups.map(m=>({name:m.name,mv:m.mv??4,mev:m.mev??8,mav:m.mav??14,mrv:m.mrv??22})),{onConflict:"name"});
      }
      let r=await db.from("muscle_groups").select("*");
      let map=Object.fromEntries(r.data.map(m=>[m.name,m.id]));
      const missing=[...new Set(exs.map(e=>e.muscle_group).filter(n=>n&&!(n in map)))];
      if(missing.length){
        await db.from("muscle_groups").insert(missing.map(n=>({name:n,mv:4,mev:8,mav:14,mrv:22})));
        r=await db.from("muscle_groups").select("*"); map=Object.fromEntries(r.data.map(m=>[m.name,m.id]));
      }
      if(replace) await db.from("exercises").update({active:false}).eq("active",true);
      const rows=exs.map((e,i)=>({name:e.name,muscle_group_id:e.muscle_group?map[e.muscle_group]:null,day:e.day,order_index:e.order_index??(i+1),base_sets:e.base_sets??3,rep_min:e.rep_min??8,rep_max:e.rep_max??12,is_anchor:!!e.is_anchor,weight_increment:e.weight_increment??2.5,active:true}));
      const ins=await db.from("exercises").insert(rows);
      if(ins.error) throw ins.error;
      setMsg({t:`${rows.length} oefeningen geïmporteerd${replace?" — schema vervangen.":"."}`,ok:true});
      await reload();
    }catch(e){ setMsg({t:"Import mislukt: "+(e.message||e),ok:false}); }
  }

  return (
    <div className="imp">
      <h3 className="section-h">Nieuw schema importeren</h3>
      <p className="section-sub">Plak je oefeningen als JSON. "Vervangen" zet je huidige schema opzij (logs blijven bewaard); "Toevoegen" plakt erbij.</p>
      <textarea placeholder="Plak hier je JSON…" value={text} onChange={e=>setText(e.target.value)}/>
      <div className="row">
        <button className="btn btn-primary" onClick={()=>doImport(true)}>Vervang schema</button>
        <button className="btn btn-ghost" onClick={()=>doImport(false)}>Voeg toe</button>
        <button className="btn btn-ghost" onClick={exportCurrent}>Exporteer huidig</button>
      </div>
      {msg && <div className={"msg "+(msg.ok?"ok":"bad")}>{msg.t}</div>}
      <h3 className="section-h">Formaat</h3>
      <pre>{example}</pre>
      <p className="section-sub">muscle_groups is optioneel — onbekende spiergroepen krijgen standaard landmarks die je later kunt bijstellen. weight_increment is 2.5 (boven) of 5 (onder).</p>
    </div>
  );
}

function Setup(){
  return (
    <div className="wrap">
      <header className="status"><div className="brand">RP · Logboek</div></header>
      <div className="setup">
        <h2>Bijna klaar — vul je sleutels in</h2>
        <p>Open <code>index.html</code> en vervang bovenin het script <code>SUPABASE_URL</code> en <code>SUPABASE_ANON_KEY</code>. Beide vind je in Supabase onder <b>Project Settings → API</b>.</p>
        <p style={{marginTop:12}}>Zorg dat je eerst <code>schema.sql</code> hebt gedraaid in de SQL Editor. Je bulk-doelen (<code>START_WEIGHT</code>, <code>GOAL_WEIGHT</code>) staan er vlak onder.</p>
      </div>
    </div>
  );
}
